name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        pillow: ['current']
        include:
          - python: '3.11'
            pillow: '10.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve and install dependencies
        run: python -m pip install '.[dev]'
      - name: Install minimum Pillow
        if: matrix.pillow != 'current'
        run: python -m pip install 'Pillow==${{ matrix.pillow }}'
      - name: Report runtime
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -ra
